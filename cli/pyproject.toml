[project]
name = "archive-cli"
version = "0.1.0"
description = "Uploader/downloader for the project archive, with client-side encryption."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
archive = "archive_cli.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archive_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
